apiVersion: apps/v1
kind: Deployment
metadata:
   name: deployment-service
spec:
        replicas: 2
        selector:
                matchLabels: 
                        app: my-nginx
        template:
                metadata:
                        labels:
                                app: my-nginx
                spec:
                        containers:
                                - name: nginx-container
                                  image: nginx
                                  ports:
                                        - containerPort: 80

